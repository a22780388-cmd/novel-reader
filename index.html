<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Novel Reader</title>

<style>

/* =========================
   COLOR SYSTEM
========================= */

:root{
 --bg:#080b18;
 --card:#10152a;
 --card2:#141a33;

 --text:#eeeaff;
 --muted:#9da5c7;

 --border:#252c50;

 --accent:#7657d9;
 --accent2:#3d63c9;
 --accentHover:#896be8;

 --danger:#b94a61;

 --size:20px;
}


/* =========================
   BASE
========================= */

*{
 box-sizing:border-box;
}

html{
 scroll-behavior:smooth;
}

body{
 margin:0;
 background:
 radial-gradient(
  circle at top right,
  #171b3b 0%,
  #080b18 45%,
  #050711 100%
 );
 color:var(--text);

 font-family:
 Georgia,
 "Times New Roman",
 serif;

 min-height:100vh;

 transition:
 background .25s,
 color .25s;
}

button,
input,
textarea{
 font:inherit;
}

button{
 cursor:pointer;
}

.hidden{
 display:none!important;
}


/* =========================
   TOP BAR
========================= */

.top{
 position:sticky;
 top:0;
 z-index:20;

 height:62px;

 display:flex;
 align-items:center;
 justify-content:space-between;

 padding:0 14px;

 background:#0c1023eF;

 backdrop-filter:blur(12px);

 border-bottom:1px solid var(--border);
}

.brand{
 border:0;
 background:none;

 color:var(--text);

 font-weight:bold;
 font-size:18px;

 padding:8px;
}

.tools{
 display:flex;
 gap:5px;
}

.btn{
 min-width:40px;
 height:40px;

 border:1px solid var(--border);

 background:var(--card);
 color:var(--text);

 border-radius:9px;

 transition:.15s;
}

.btn:hover{
 border-color:var(--accent);
 background:var(--card2);
}


/* =========================
   LAYOUT
========================= */

main{
 width:min(1000px,calc(100% - 20px));

 margin:auto;

 padding:22px 0 70px;
}


/* =========================
   PANELS
========================= */

.hero,
.reader,
.novel-head,
.editor{

 background:
 linear-gradient(
  145deg,
  rgba(20,26,51,.96),
  rgba(11,15,34,.98)
 );

 border:1px solid var(--border);

 border-radius:18px;

 padding:22px;

 box-shadow:
 0 15px 45px rgba(0,0,0,.35);
}


/* =========================
   HERO
========================= */

.hero{
 display:flex;
 justify-content:space-between;
 align-items:center;

 gap:18px;
}

.hero h1{
 margin-bottom:8px;
}


/* =========================
   TEXT
========================= */

h1,
h2{
 margin-top:0;
}

.muted{
 color:var(--muted);
}


/* =========================
   BUTTONS
========================= */

.primary{

 background:
 linear-gradient(
  135deg,
  var(--accent),
  var(--accent2)
 );

 color:white;

 border:0;

 border-radius:10px;

 padding:13px 18px;

 white-space:nowrap;

 box-shadow:
 0 6px 20px rgba(70,70,180,.25);

 transition:.15s;
}

.primary:hover{
 background:
 linear-gradient(
  135deg,
  var(--accentHover),
  #4d72db
 );

 transform:translateY(-1px);
}

.secondary{

 background:#0c1125;

 color:var(--text);

 border:1px solid var(--border);

 border-radius:9px;

 padding:10px 14px;
}

.secondary:hover{
 border-color:var(--accent);
}

.danger{
 color:#e98296;

 border-color:#713342;

 padding:9px 12px;
}


/* =========================
   LIBRARY
========================= */

.grid{

 display:grid;

 grid-template-columns:
 repeat(
  auto-fill,
  minmax(250px,1fr)
 );

 gap:15px;

 margin-top:20px;
}

.card{

 background:
 linear-gradient(
  145deg,
  #141a35,
  #0d1227
 );

 border:1px solid var(--border);

 border-radius:15px;

 padding:18px;

 transition:.18s;
}

.card:hover{

 border-color:#3b4677;

 transform:translateY(-2px);

 box-shadow:
 0 12px 30px rgba(0,0,0,.25);
}

.card h2{
 font-size:21px;
}

.card-actions{

 display:flex;

 gap:8px;

 margin-top:18px;
}

.card-actions button{

 flex:1;

 padding:10px;

 border-radius:9px;
}

.continue{

 background:
 linear-gradient(
  135deg,
  var(--accent),
  var(--accent2)
 );

 color:white;

 border:0;
}


/* =========================
   EMPTY STATE
========================= */

.empty{

 text-align:center;

 padding:65px 15px;

 color:var(--muted);
}

.empty h2{
 color:var(--text);
}


/* =========================
   BACK
========================= */

.back{
 margin-bottom:15px;
}


/* =========================
   NOVEL HEADER
========================= */

.novel-head{

 display:flex;

 justify-content:space-between;

 gap:15px;

 margin-bottom:20px;
}


/* =========================
   CHAPTER LIST
========================= */

.chapter{

 width:100%;

 display:flex;

 gap:12px;

 align-items:center;

 text-align:left;

 background:
 linear-gradient(
  135deg,
  #121832,
  #0d1228
 );

 color:var(--text);

 border:1px solid var(--border);

 border-radius:11px;

 padding:14px;

 margin-bottom:8px;

 transition:.15s;
}

.chapter:hover{

 border-color:var(--accent);

 background:#151b38;
}

.num{

 color:#9a7df0;

 font-weight:bold;

 min-width:50px;
}

.name{

 flex:1;

 overflow:hidden;

 text-overflow:ellipsis;
}

.chapter-actions{

 display:flex;

 gap:6px;
}

.small-btn{

 border:1px solid var(--border);

 background:#0a0f22;

 color:var(--text);

 border-radius:7px;

 padding:6px 9px;
}

.small-btn:hover{

 border-color:var(--accent);

 color:white;
}


/* =========================
   READER
========================= */

.reader{

 max-width:850px;

 margin:auto;

 padding:
 clamp(20px,5vw,55px);
}

.reader-tools{

 display:flex;

 gap:5px;

 margin-bottom:45px;
}

.heading{

 text-align:left;

 margin-bottom:38px;
}

.heading .label{

 color:#9074ed;

 font:bold 13px Arial;

 letter-spacing:1.5px;
}

.heading h1{

 font-size:
 clamp(30px,6vw,46px);

 line-height:1.15;

 margin:8px 0;

 color:#f3efff;
}


/* =========================
   CONTENT
========================= */

.content{

 text-align:left;

 font-size:var(--size);

 line-height:1.95;

 user-select:text;

 -webkit-user-select:text;

 color:#e9e7f2;
}

.content p{

 margin:
 0 0 1.35em;

 white-space:pre-wrap;
}


/* =========================
   READER NAVIGATION
========================= */

.nav{

 display:flex;

 gap:10px;

 justify-content:space-between;

 margin-top:55px;

 padding-top:20px;

 border-top:
 1px solid var(--border);
}

.nav button{

 flex:1;

 padding:12px;

 border-radius:9px;

 border:1px solid var(--border);

 background:#0d1227;

 color:var(--text);
}

.nav button:hover{
 border-color:var(--accent);
}

.nav .next{

 background:
 linear-gradient(
  135deg,
  var(--accent),
  var(--accent2)
 );

 color:white;

 border:0;
}


/* =========================
   EDITOR
========================= */

.editor{

 max-width:850px;

 margin:auto;
}

.form-group{

 margin-bottom:18px;
}

.form-group label{

 display:block;

 margin-bottom:8px;

 font-weight:bold;

 color:#d9d7ea;
}

.form-group input,
.form-group textarea{

 width:100%;

 border:1px solid var(--border);

 border-radius:10px;

 background:#090e20;

 color:var(--text);

 padding:13px;

 outline:none;

 transition:.15s;
}

.form-group input:focus,
.form-group textarea:focus{

 border-color:var(--accent);

 box-shadow:
 0 0 0 2px rgba(118,87,217,.12);
}

.form-group textarea{

 min-height:420px;

 resize:vertical;

 line-height:1.8;
}

.editor-actions{

 display:flex;

 gap:10px;

 margin-top:15px;
}

.editor-actions button{

 flex:1;
}


/* =========================
   MODAL
========================= */

.modal{

 position:fixed;

 inset:0;

 background:
 rgba(2,4,12,.78);

 backdrop-filter:blur(5px);

 display:flex;

 align-items:center;

 justify-content:center;

 padding:20px;

 z-index:50;
}

.modal-box{

 width:min(500px,100%);

 background:
 linear-gradient(
  145deg,
  #171d3b,
  #0c1127
 );

 border:1px solid var(--border);

 border-radius:17px;

 padding:22px;

 box-shadow:
 0 25px 70px rgba(0,0,0,.55);
}

.modal-box input{

 width:100%;

 padding:13px;

 border:1px solid var(--border);

 border-radius:10px;

 background:#090e20;

 color:var(--text);

 margin:12px 0;

 outline:none;
}

.modal-box input:focus{

 border-color:var(--accent);
}

.modal-actions{

 display:flex;

 gap:10px;
}

.modal-actions button{

 flex:1;

 padding:11px;

 border-radius:9px;
}


/* =========================
   TOAST
========================= */

.toast{

 position:fixed;

 bottom:20px;

 left:50%;

 transform:
 translateX(-50%);

 background:#e9e6f4;

 color:#101225;

 padding:10px 15px;

 border-radius:9px;

 opacity:0;

 pointer-events:none;

 transition:.2s;

 z-index:100;

 box-shadow:
 0 8px 30px rgba(0,0,0,.35);
}

.toast.show{
 opacity:1;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

 .hero,
 .novel-head{

  flex-direction:column;

  align-items:stretch;
 }

 .primary{
  width:100%;
 }

 .reader{

  padding:
  20px 15px;
 }

 .nav{

  flex-direction:column;
 }

 .top{

  padding:
  0 8px;
 }

 .brand{

  font-size:15px;
 }

 .editor-actions{

  flex-direction:column;
 }

 .chapter{

  align-items:flex-start;
 }

 .chapter-actions{

  flex-direction:column;
 }

}


/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar{
 width:9px;
}

::-webkit-scrollbar-track{
 background:#070a15;
}

::-webkit-scrollbar-thumb{

 background:#2d3560;

 border-radius:10px;
}

::-webkit-scrollbar-thumb:hover{
 background:#4b568b;
}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="top">

<button
 class="brand"
 onclick="library()"
>
📚 Novel Reader
</button>

<div class="tools">

<button
 class="btn"
 onclick="font(-2)"
>
A−
</button>

<button
 class="btn"
 onclick="font(0)"
>
A
</button>

<button
 class="btn"
 onclick="font(2)"
>
A+
</button>

<button
 class="btn"
 onclick="theme()"
>
☾
</button>

</div>

</header>


<main>


<!-- =========================
     LIBRARY
========================= -->

<section id="library">

<div class="hero">

<div>

<h1>My Library</h1>

<p class="muted">
Create your library and add chapters manually.
</p>

</div>


<button
 class="primary"
 onclick="openNovelModal()"
>
+ Add Novel
</button>

</div>


<div
 id="empty"
 class="empty"
>

<h2>
📖 Your library is empty
</h2>

<p>
Create your first novel to get started.
</p>

</div>


<div
 id="grid"
 class="grid"
></div>

</section>



<!-- =========================
     CHAPTER LIST
========================= -->

<section
 id="chapters"
 class="hidden"
>

<button
 class="btn back"
 onclick="library()"
>
← Library
</button>


<div class="novel-head">

<div>

<p class="muted">
Novel
</p>

<h1 id="novelTitle"></h1>

<p
 id="novelInfo"
 class="muted"
></p>

</div>


<button
 class="btn danger"
 onclick="deleteNovel()"
>
Delete Novel
</button>

</div>


<button
 class="primary"
 onclick="openChapterEditor()"
>
+ Add Chapter
</button>


<div style="height:20px"></div>


<div
 id="chapterList"
></div>

</section>



<!-- =========================
     CHAPTER EDITOR
========================= -->

<section
 id="editorSection"
 class="hidden"
>

<button
 class="btn back"
 onclick="showChapters()"
>
← Back to Chapters
</button>


<div class="editor">

<h1 id="editorHeading">
Add Chapter
</h1>


<div class="form-group">

<label for="chapterTitleInput">
Chapter Title
</label>

<input
 id="chapterTitleInput"
 type="text"
 placeholder="Example: Chapter One"
/>

</div>


<div class="form-group">

<label for="chapterTextInput">
Chapter Text
</label>

<textarea
 id="chapterTextInput"
 placeholder="Paste your chapter here..."
></textarea>

</div>


<div class="editor-actions">

<button
 class="secondary"
 onclick="showChapters()"
>
Cancel
</button>


<button
 class="primary"
 onclick="saveChapter()"
>
Save Chapter
</button>

</div>

</div>

</section>



<!-- =========================
     READER
========================= -->

<section
 id="readerSection"
 class="hidden"
>

<button
 class="btn back"
 onclick="showChapters()"
>
← Chapters
</button>


<article class="reader">


<div class="reader-tools">

<button
 class="btn"
 onclick="font(-2)"
>
A−
</button>

<button
 class="btn"
 onclick="font(0)"
>
A
</button>

<button
 class="btn"
 onclick="font(2)"
>
A+
</button>

<button
 class="btn"
 onclick="theme()"
>
☾
</button>

</div>


<div class="heading">

<div
 id="chapterLabel"
 class="label"
></div>


<h1
 id="chapterTitle"
></h1>

</div>


<div
 id="content"
 class="content"
></div>


<div class="nav">

<button
 id="prev"
 onclick="moveChapter(-1)"
>
Previous Chapter
</button>


<button
 id="next"
 class="next"
 onclick="moveChapter(1)"
>
Next Chapter
</button>

</div>

</article>

</section>


</main>



<!-- =========================
     NOVEL MODAL
========================= -->

<div
 id="novelModal"
 class="modal hidden"
>

<div class="modal-box">

<h2>
Create New Novel
</h2>

<p class="muted">
Enter the name of your novel.
</p>


<input
 id="novelNameInput"
 type="text"
 placeholder="Novel title"
/>


<div class="modal-actions">

<button
 class="secondary"
 onclick="closeNovelModal()"
>
Cancel
</button>


<button
 class="primary"
 onclick="createNovel()"
>
Create Novel
</button>

</div>

</div>

</div>



<div
 id="toast"
 class="toast"
></div>



<script>

/* =========================
   DATABASE
========================= */

const DB="NovelReaderDB";
const STORE="novels";

let novels=[];
let current=null;
let chapterIndex=0;
let editingChapterIndex=null;

let fontSize=
 Number(
  localStorage.getItem("fontSize")||20
 );

let dark=
 localStorage.getItem("dark")==="1";


function db(){

 return new Promise((resolve,reject)=>{

  let r=indexedDB.open(DB,1);

  r.onupgradeneeded=()=>{

   if(
    !r.result.objectStoreNames
    .contains(STORE)
   ){

    r.result.createObjectStore(
     STORE,
     {keyPath:"id"}
    );

   }

  };

  r.onsuccess=()=>{
   resolve(r.result);
  };

  r.onerror=()=>{
   reject(r.error);
  };

 });

}


async function all(){

 let d=await db();

 return new Promise((resolve,reject)=>{

  let r=
   d.transaction(
    STORE,
    "readonly"
   )
   .objectStore(STORE)
   .getAll();

  r.onsuccess=()=>{
   resolve(r.result);
  };

  r.onerror=()=>{
   reject(r.error);
  };

 });

}


async function save(n){

 let d=await db();

 return new Promise((resolve,reject)=>{

  let t=
   d.transaction(
    STORE,
    "readwrite"
   );

  t.objectStore(STORE).put(n);

  t.oncomplete=resolve;

  t.onerror=()=>{
   reject(t.error);
  };

 });

}


async function remove(id){

 let d=await db();

 return new Promise((resolve,reject)=>{

  let t=
   d.transaction(
    STORE,
    "readwrite"
   );

  t.objectStore(STORE).delete(id);

  t.oncomplete=resolve;

  t.onerror=()=>{
   reject(t.error);
  };

 });

}


function id(){

 return Date.now()+
 "-" +
 Math.random()
  .toString(16)
  .slice(2);

}


/* =========================
   UI
========================= */

function toast(t){

 let e=
  document.getElementById("toast");

 e.textContent=t;

 e.classList.add("show");

 setTimeout(()=>{
  e.classList.remove("show");
 },2200);

}


function hide(){

 [
  "library",
  "chapters",
  "editorSection",
  "readerSection"
 ].forEach(id=>{

  document
   .getElementById(id)
   .classList
   .add("hidden");

 });

}


function library(){

 hide();

 document
  .getElementById("library")
  .classList
  .remove("hidden");

 renderLibrary();

}


/* =========================
   LIBRARY
========================= */

function renderLibrary(){

 let grid=
  document.getElementById("grid");

 grid.innerHTML="";


 document
  .getElementById("empty")
  .classList
  .toggle(
   "hidden",
   novels.length>0
  );


 novels.forEach(n=>{

  let card=
   document.createElement("div");

  card.className="card";


  let title=
   document.createElement("h2");

  title.textContent=n.title;


  let info=
   document.createElement("p");

  info.className="muted";

  info.textContent=
   n.chapters.length+
   (
    n.chapters.length===1
    ?" chapter"
    :" chapters"
   )+
   " • Last read: "+
   (
    n.chapters.length
    ?"Chapter "+((n.last||0)+1)
    :"None"
   );


  let actions=
   document.createElement("div");

  actions.className="card-actions";


  let go=
   document.createElement("button");

  go.className="continue";

  go.textContent=
   n.chapters.length
   ?"Continue Reading"
   :"Open Novel";


  go.onclick=()=>{

   if(n.chapters.length){

    openReader(
     n,
     n.last||0
    );

   }else{

    openNovel(n);

   }

  };


  let list=
   document.createElement("button");

  list.className="secondary";

  list.textContent="Chapters";

  list.onclick=()=>{
   openNovel(n);
  };


  actions.append(
   go,
   list
  );

  card.append(
   title,
   info,
   actions
  );

  grid.append(card);

 });

}


/* =========================
   CREATE NOVEL
========================= */

function openNovelModal(){

 document
  .getElementById("novelModal")
  .classList
  .remove("hidden");

 document
  .getElementById("novelNameInput")
  .value="";

 document
  .getElementById("novelNameInput")
  .focus();

}


function closeNovelModal(){

 document
  .getElementById("novelModal")
  .classList
  .add("hidden");

}


async function createNovel(){

 let input=
  document
   .getElementById("novelNameInput");

 let title=
  input.value.trim();


 if(!title){

  toast(
   "Please enter a novel title."
  );

  return;

 }


 let n={

  id:id(),

  title:title,

  chapters:[],

  last:0,

  added:Date.now()

 };


 await save(n);

 novels.push(n);

 closeNovelModal();

 openNovel(n);

 toast(
  "Novel created."
 );

}


/* =========================
   NOVEL
========================= */

function openNovel(n){

 current=n;

 hide();

 document
  .getElementById("chapters")
  .classList
  .remove("hidden");


 document
  .getElementById("novelTitle")
  .textContent=n.title;


 document
  .getElementById("novelInfo")
  .textContent=
   n.chapters.length+
   (
    n.chapters.length===1
    ?" chapter"
    :" chapters"
   );


 renderChapters();

}


function renderChapters(){

 let list=
  document
   .getElementById("chapterList");

 list.innerHTML="";


 if(!current.chapters.length){

  let empty=
   document.createElement("div");

  empty.className="empty";

  empty.innerHTML=
   "<h2>No chapters yet</h2>"+
   "<p>Add your first chapter to start reading.</p>";

  list.append(empty);

  return;

 }


 current.chapters.forEach(
  (c,i)=>{

   let row=
    document.createElement("div");

   row.className="chapter";


   let num=
    document.createElement("span");

   num.className="num";

   num.textContent=
    "#"+(i+1);


   let name=
    document.createElement("span");

   name.className="name";

   name.textContent=
    c.title;


   let actions=
    document.createElement("div");

   actions.className=
    "chapter-actions";


   let read=
    document.createElement("button");

   read.className="small-btn";

   read.textContent="Read";

   read.onclick=()=>{
    openReader(
     current,
     i
    );
   };


   let edit=
    document.createElement("button");

   edit.className="small-btn";

   edit.textContent="Edit";

   edit.onclick=()=>{
    editChapter(i);
   };


   let del=
    document.createElement("button");

   del.className="small-btn";

   del.textContent="Delete";

   del.onclick=()=>{
    deleteChapter(i);
   };


   actions.append(
    read,
    edit,
    del
   );


   row.append(
    num,
    name,
    actions
   );


   list.append(row);

  }
 );

}


/* =========================
   CHAPTER EDITOR
========================= */

function openChapterEditor(){

 editingChapterIndex=null;

 document
  .getElementById("editorHeading")
  .textContent="Add Chapter";


 document
  .getElementById("chapterTitleInput")
  .value="";


 document
  .getElementById("chapterTextInput")
  .value="";


 hide();


 document
  .getElementById("editorSection")
  .classList
  .remove("hidden");


 document
  .getElementById("chapterTitleInput")
  .focus();

}


function editChapter(i){

 let c=
  current.chapters[i];

 editingChapterIndex=i;


 document
  .getElementById("editorHeading")
  .textContent="Edit Chapter";


 document
  .getElementById("chapterTitleInput")
  .value=c.title;


 document
  .getElementById("chapterTextInput")
  .value=c.text;


 hide();


 document
  .getElementById("editorSection")
  .classList
  .remove("hidden");

}


async function saveChapter(){

 let title=
  document
   .getElementById(
    "chapterTitleInput"
   )
   .value
   .trim();


 let text=
  document
   .getElementById(
    "chapterTextInput"
   )
   .value
   .trim();


 if(!title){

  toast(
   "Please enter a chapter title."
  );

  return;

 }


 if(!text){

  toast(
   "Please enter the chapter text."
  );

  return;

 }


 let chapter={

  title:title,

  text:text

 };


 if(
  editingChapterIndex===null
 ){

  current.chapters.push(
   chapter
  );

  current.last=
   current.chapters.length-1;

  toast(
   "Chapter saved."
  );

 }else{

  current.chapters[
   editingChapterIndex
  ]=chapter;

  toast(
   "Chapter updated."
  );

 }


 await save(current);

 openNovel(current);

}


async function deleteChapter(i){

 if(
  !confirm(
   "Delete this chapter?"
  )
 )return;


 current.chapters.splice(
  i,
  1
 );


 if(
  current.last>=
  current.chapters.length
 ){

  current.last=
   Math.max(
    0,
    current.chapters.length-1
   );

 }


 await save(current);

 renderChapters();

 toast(
  "Chapter deleted."
 );

}


/* =========================
   READER
========================= */

function showChapters(){

 if(current){
  openNovel(current);
 }

}


async function openReader(n,i){

 if(!n.chapters.length)
  return;


 current=n;

 chapterIndex=i;

 current.last=i;

 await save(current);

 hide();


 document
  .getElementById("readerSection")
  .classList
  .remove("hidden");


 let c=
  n.chapters[i];


 document
  .getElementById(
   "chapterLabel"
  )
  .textContent=
   "CHAPTER "+(i+1);


 document
  .getElementById(
   "chapterTitle"
  )
  .textContent=
   c.title;


 let content=
  document.getElementById(
   "content"
  );

 content.innerHTML="";


 let paragraphs=
  c.text
   .replace(/\r\n?/g,"\n")
   .split(/\n\s*\n/)
   .map(x=>x.trim())
   .filter(Boolean);


 paragraphs.forEach(p=>{

  let el=
   document.createElement("p");

  el.textContent=p;

  content.append(el);

 });


 document
  .getElementById("prev")
  .disabled=i<=0;


 document
  .getElementById("next")
  .disabled=
   i>=n.chapters.length-1;


 window.scrollTo(
  0,
  0
 );

}


function moveChapter(d){

 let x=
  chapterIndex+d;


 if(
  !current ||
  x<0 ||
  x>=current.chapters.length
 ){
  return;
 }


 openReader(
  current,
  x
 );

}


/* =========================
   DELETE NOVEL
========================= */

async function deleteNovel(){

 if(!current)
  return;


 if(
  !confirm(
   "Delete this novel and all its chapters?"
  )
 ){
  return;
 }


 await remove(
  current.id
 );


 novels=
  novels.filter(
   x=>x.id!==current.id
  );


 current=null;


 library();


 toast(
  "Novel deleted."
 );

}


/* =========================
   FONT
========================= */

function font(d){

 if(d===0){

  fontSize=20;

 }else{

  fontSize+=d;

 }


 fontSize=
  Math.max(
   16,
   Math.min(
    28,
    fontSize
   )
  );


 document
  .documentElement
  .style
  .setProperty(
   "--size",
   fontSize+"px"
  );


 localStorage.setItem(
  "fontSize",
  fontSize
 );

}


/* =========================
   THEME
========================= */

function theme(){

 dark=!dark;

 document
  .body
  .classList
  .toggle(
   "dark",
   dark
  );


 localStorage.setItem(
  "dark",
  dark?"1":"0"
 );

}


/* =========================
   START
========================= */

document
 .body
 .classList
 .toggle(
  "dark",
  dark
 );


font(0);


(async()=>{

 try{

  novels=await all();

 }catch(e){

  console.error(e);

  novels=[];

 }

 library();

})();

</script>
