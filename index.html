<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novel Reader</title>

<style>
:root{
 --bg:#f4f1ea;
 --card:#fffdf8;
 --text:#292722;
 --muted:#716c62;
 --border:#d8d1c5;
 --accent:#6f4e37;
 --danger:#a33b32;
 --size:20px;
}

body.dark{
 --bg:#171717;
 --card:#202020;
 --text:#e8e4dc;
 --muted:#aaa59c;
 --border:#3a3936;
 --accent:#c4a27b;
}

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Georgia,"Times New Roman",serif;
 transition:.2s;
}

button,
input,
textarea{
 font:inherit;
}

button{
 cursor:pointer;
}

.top{
 position:sticky;
 top:0;
 z-index:10;
 height:62px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 14px;
 background:var(--card);
 border-bottom:1px solid var(--border);
}

.brand{
 border:0;
 background:none;
 color:var(--text);
 font-weight:bold;
 font-size:18px;
}

.tools{
 display:flex;
 gap:5px;
}

.btn{
 border:1px solid var(--border);
 background:var(--card);
 color:var(--text);
 border-radius:9px;
 min-width:40px;
 height:40px;
}

main{
 width:min(1000px,calc(100% - 20px));
 margin:auto;
 padding:22px 0 60px;
}

.hidden{
 display:none!important;
}

.hero,
.reader,
.novel-head,
.editor{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:16px;
 padding:22px;
 box-shadow:0 8px 25px #00000010;
}

.hero{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px;
}

h1,
h2{
 margin-top:0;
}

.muted{
 color:var(--muted);
}

.primary{
 background:var(--accent);
 color:white;
 border:0;
 border-radius:10px;
 padding:13px 18px;
 white-space:nowrap;
}

.secondary{
 background:var(--bg);
 color:var(--text);
 border:1px solid var(--border);
 border-radius:9px;
 padding:10px 14px;
}

.danger{
 color:var(--danger);
 border-color:var(--danger);
 padding:9px 12px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
 gap:15px;
 margin-top:20px;
}

.card{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:14px;
 padding:18px;
}

.card h2{
 font-size:21px;
}

.card-actions{
 display:flex;
 gap:8px;
 margin-top:18px;
}

.card-actions button{
 flex:1;
 padding:10px;
 border-radius:9px;
}

.continue{
 background:var(--accent);
 color:white;
 border:0;
}

.empty{
 text-align:center;
 padding:60px 15px;
 color:var(--muted);
}

.back{
 margin-bottom:15px;
}

.novel-head{
 display:flex;
 justify-content:space-between;
 gap:15px;
 margin-bottom:20px;
}

.chapter{
 width:100%;
 display:flex;
 gap:12px;
 align-items:center;
 text-align:left;
 background:var(--card);
 color:var(--text);
 border:1px solid var(--border);
 border-radius:10px;
 padding:14px;
 margin-bottom:8px;
}

.chapter:hover{
 border-color:var(--accent);
}

.num{
 color:var(--accent);
 font-weight:bold;
 min-width:50px;
}

.name{
 flex:1;
}

.chapter-actions{
 display:flex;
 gap:6px;
}

.small-btn{
 border:1px solid var(--border);
 background:var(--bg);
 color:var(--text);
 border-radius:7px;
 padding:6px 9px;
}

.reader{
 max-width:850px;
 margin:auto;
 padding:clamp(20px,5vw,55px);
}

.reader-tools{
 display:flex;
 gap:5px;
 margin-bottom:45px;
}

.heading{
 text-align:left;
 margin-bottom:35px;
}

.heading .label{
 color:var(--accent);
 font:bold 13px Arial;
}

.heading h1{
 font-size:clamp(30px,6vw,46px);
 margin:8px 0;
}

.subtitle{
 color:var(--muted);
 font-size:21px;
}

.content{
 text-align:left;
 font-size:var(--size);
 line-height:1.95;
 user-select:text;
 -webkit-user-select:text;
}

.content p{
 margin:0 0 1.35em;
 white-space:pre-wrap;
}

.nav{
 display:flex;
 gap:10px;
 justify-content:space-between;
 margin-top:50px;
 padding-top:20px;
 border-top:1px solid var(--border);
}

.nav button{
 flex:1;
 padding:12px;
 border-radius:9px;
 border:1px solid var(--border);
 background:var(--card);
 color:var(--text);
}

.nav .next{
 background:var(--accent);
 color:white;
}

.editor{
 max-width:850px;
 margin:auto;
}

.form-group{
 margin-bottom:18px;
}

.form-group label{
 display:block;
 margin-bottom:8px;
 font-weight:bold;
}

.form-group input,
.form-group textarea{
 width:100%;
 border:1px solid var(--border);
 border-radius:10px;
 background:var(--bg);
 color:var(--text);
 padding:13px;
 outline:none;
}

.form-group input:focus,
.form-group textarea:focus{
 border-color:var(--accent);
}

.form-group textarea{
 min-height:420px;
 resize:vertical;
 line-height:1.8;
}

.editor-actions{
 display:flex;
 gap:10px;
 margin-top:15px;
}

.editor-actions button{
 flex:1;
}

.toast{
 position:fixed;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 background:var(--text);
 color:var(--bg);
 padding:10px 15px;
 border-radius:9px;
 opacity:0;
 pointer-events:none;
 transition:.2s;
 z-index:100;
}

.toast.show{
 opacity:1;
}

.modal{
 position:fixed;
 inset:0;
 background:#00000066;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 z-index:50;
}

.modal-box{
 width:min(500px,100%);
 background:var(--card);
 border:1px solid var(--border);
 border-radius:16px;
 padding:22px;
}

.modal-box input{
 width:100%;
 padding:13px;
 border:1px solid var(--border);
 border-radius:10px;
 background:var(--bg);
 color:var(--text);
 margin:12px 0;
}

.modal-actions{
 display:flex;
 gap:10px;
}

.modal-actions button{
 flex:1;
 padding:11px;
 border-radius:9px;
}

@media(max-width:600px){

 .hero,
 .novel-head{
  flex-direction:column;
  align-items:stretch;
 }

 .primary{
  width:100%;
 }

 .reader{
  padding:20px 15px;
 }

 .nav{
  flex-direction:column;
 }

 .top{
  padding:0 8px;
 }

 .brand{
  font-size:15px;
 }

 .editor-actions{
  flex-direction:column;
 }

 .chapter{
  align-items:flex-start;
 }

 .chapter-actions{
  flex-direction:column;
 }
}
</style>
</head>

<body>

<header class="top">

<button class="brand" onclick="library()">
📚 Novel Reader
</button>

<div class="tools">
<button class="btn" onclick="font(-2)">A−</button>
<button class="btn" onclick="font(0)">A</button>
<button class="btn" onclick="font(2)">A+</button>
<button class="btn" onclick="theme()">☾</button>
</div>

</header>

<main>

<!-- LIBRARY -->

<section id="library">

<div class="hero">

<div>
<h1>My Library</h1>
<p class="muted">
Create your library and add chapters manually.
</p>
</div>

<button class="primary" onclick="openNovelModal()">
+ Add Novel
</button>

</div>

<div id="empty" class="empty">
<h2>📖 Your library is empty</h2>
<p>Create your first novel to get started.</p>
</div>

<div id="grid" class="grid"></div>

</section>


<!-- CHAPTER LIST -->

<section id="chapters" class="hidden">

<button class="btn back" onclick="library()">
← Library
</button>

<div class="novel-head">

<div>
<p class="muted">Novel</p>
<h1 id="novelTitle"></h1>
<p id="novelInfo" class="muted"></p>
</div>

<button class="btn danger" onclick="deleteNovel()">
Delete Novel
</button>

</div>

<button class="primary" onclick="openChapterEditor()">
+ Add Chapter
</button>

<div style="height:20px"></div>

<div id="chapterList"></div>

</section>


<!-- CHAPTER EDITOR -->

<section id="editorSection" class="hidden">

<button class="btn back" onclick="showChapters()">
← Back to Chapters
</button>

<div class="editor">

<h1 id="editorHeading">Add Chapter</h1>

<div class="form-group">

<label for="chapterTitleInput">
Chapter Title
</label>

<input
 id="chapterTitleInput"
 type="text"
 placeholder="Example: Chapter One"
/>

</div>

<div class="form-group">

<label for="chapterTextInput">
Chapter Text
</label>

<textarea
 id="chapterTextInput"
 placeholder="Paste your chapter here..."
></textarea>

</div>

<div class="editor-actions">

<button class="secondary" onclick="showChapters()">
Cancel
</button>

<button class="primary" onclick="saveChapter()">
Save Chapter
</button>

</div>

</div>

</section>


<!-- READER -->

<section id="readerSection" class="hidden">

<button class="btn back" onclick="showChapters()">
← Chapters
</button>

<article class="reader">

<div class="reader-tools">

<button class="btn" onclick="font(-2)">A−</button>
<button class="btn" onclick="font(0)">A</button>
<button class="btn" onclick="font(2)">A+</button>
<button class="btn" onclick="theme()">☾</button>

</div>

<div class="heading">

<div id="chapterLabel" class="label"></div>

<h1 id="chapterTitle"></h1>

</div>

<div id="content" class="content"></div>

<div class="nav">

<button id="prev" onclick="moveChapter(-1)">
Previous Chapter
</button>

<button id="next" class="next" onclick="moveChapter(1)">
Next Chapter
</button>

</div>

</article>

</section>

</main>


<!-- NOVEL MODAL -->

<div id="novelModal" class="modal hidden">

<div class="modal-box">

<h2>Create New Novel</h2>

<p class="muted">
Enter the name of your novel.
</p>

<input
 id="novelNameInput"
 type="text"
 placeholder="Novel title"
/>

<div class="modal-actions">

<button
 class="secondary"
 onclick="closeNovelModal()"
>
Cancel
</button>

<button
 class="primary"
 onclick="createNovel()"
>
Create Novel
</button>

</div>

</div>

</div>


<div id="toast" class="toast"></div>


<script>

const DB="NovelReaderDB";
const STORE="novels";

let novels=[];
let current=null;
let chapterIndex=0;
let editingChapterIndex=null;

let fontSize=Number(localStorage.getItem("fontSize")||20);
let dark=localStorage.getItem("dark")==="1";


/* DATABASE */

function db(){

 return new Promise((resolve,reject)=>{

  let r=indexedDB.open(DB,1);

  r.onupgradeneeded=()=>{

   if(!r.result.objectStoreNames.contains(STORE)){

    r.result.createObjectStore(
     STORE,
     {keyPath:"id"}
    );

   }

  };

  r.onsuccess=()=>resolve(r.result);

  r.onerror=()=>reject(r.error);

 });

}


async function all(){

 let d=await db();

 return new Promise((resolve,reject)=>{

  let r=d
   .transaction(STORE,"readonly")
   .objectStore(STORE)
   .getAll();

  r.onsuccess=()=>resolve(r.result);

  r.onerror=()=>reject(r.error);

 });

}


async function save(n){

 let d=await db();

 return new Promise((resolve,reject)=>{

  let t=d.transaction(STORE,"readwrite");

  t.objectStore(STORE).put(n);

  t.oncomplete=resolve;

  t.onerror=()=>reject(t.error);

 });

}


async function remove(id){

 let d=await db();

 return new Promise((resolve,reject)=>{

  let t=d.transaction(STORE,"readwrite");

  t.objectStore(STORE).delete(id);

  t.oncomplete=resolve;

  t.onerror=()=>reject(t.error);

 });

}


function id(){

 return Date.now()+"-"+Math.random()
  .toString(16)
  .slice(2);

}


/* UI */

function toast(t){

 let e=document.getElementById("toast");

 e.textContent=t;

 e.classList.add("show");

 setTimeout(()=>{
  e.classList.remove("show");
 },2200);

}


function hide(){

 document
  .getElementById("library")
  .classList.add("hidden");

 document
  .getElementById("chapters")
  .classList.add("hidden");

 document
  .getElementById("editorSection")
  .classList.add("hidden");

 document
  .getElementById("readerSection")
  .classList.add("hidden");

}


function library(){

 hide();

 document
  .getElementById("library")
  .classList.remove("hidden");

 renderLibrary();

}


/* LIBRARY */

function renderLibrary(){

 let grid=document.getElementById("grid");

 grid.innerHTML="";

 document
  .getElementById("empty")
  .classList
  .toggle("hidden",novels.length>0);


 novels.forEach(n=>{

  let c=document.createElement("div");

  c.className="card";


  let title=document.createElement("h2");

  title.textContent=n.title;


  let info=document.createElement("p");

  info.className="muted";

  info.textContent=
   n.chapters.length+
   (n.chapters.length===1?" chapter":" chapters")+
   " • Last read: "+
   (n.chapters.length?("Chapter "+((n.last||0)+1)):"None");


  let actions=document.createElement("div");

  actions.className="card-actions";


  let go=document.createElement("button");

  go.className="continue";

  go.textContent=
   n.chapters.length?
   "Continue Reading":
   "Open Novel";

  go.onclick=()=>{

   if(n.chapters.length)
    openReader(n,n.last||0);
   else
    openNovel(n);

  };


  let list=document.createElement("button");

  list.className="secondary";

  list.textContent="Chapters";

  list.onclick=()=>openNovel(n);


  actions.append(go,list);

  c.append(title,info,actions);

  grid.append(c);

 });

}


/* NOVEL CREATION */

function openNovelModal(){

 document
  .getElementById("novelModal")
  .classList
  .remove("hidden");

 document
  .getElementById("novelNameInput")
  .value="";

 document
  .getElementById("novelNameInput")
  .focus();

}


function closeNovelModal(){

 document
  .getElementById("novelModal")
  .classList
  .add("hidden");

}


async function createNovel(){

 let input=document
  .getElementById("novelNameInput");

 let title=input.value.trim();

 if(!title){

  toast("Please enter a novel title.");

  return;

 }


 let n={

  id:id(),

  title:title,

  chapters:[],

  last:0,

  added:Date.now()

 };


 await save(n);

 novels.push(n);

 closeNovelModal();

 openNovel(n);

 toast("Novel created.");

}


/* NOVEL */

function openNovel(n){

 current=n;

 hide();

 document
  .getElementById("chapters")
  .classList
  .remove("hidden");


 document
  .getElementById("novelTitle")
  .textContent=n.title;


 document
  .getElementById("novelInfo")
  .textContent=
   n.chapters.length+
   (n.chapters.length===1?" chapter":" chapters");


 renderChapters();

}


function renderChapters(){

 let list=document
  .getElementById("chapterList");

 list.innerHTML="";


 if(!current.chapters.length){

  let empty=document.createElement("div");

  empty.className="empty";

  empty.innerHTML=
   "<h2>No chapters yet</h2>"+
   "<p>Add your first chapter to start reading.</p>";

  list.append(empty);

  return;

 }


 current.chapters.forEach((c,i)=>{

  let row=document.createElement("div");

  row.className="chapter";


  let num=document.createElement("span");

  num.className="num";

  num.textContent="#"+(i+1);


  let name=document.createElement("span");

  name.className="name";

  name.textContent=c.title;


  let actions=document.createElement("div");

  actions.className="chapter-actions";


  let read=document.createElement("button");

  read.className="small-btn";

  read.textContent="Read";

  read.onclick=()=>openReader(current,i);


  let edit=document.createElement("button");

  edit.className="small-btn";

  edit.textContent="Edit";

  edit.onclick=()=>editChapter(i);


  let del=document.createElement("button");

  del.className="small-btn";

  del.textContent="Delete";

  del.onclick=()=>deleteChapter(i);


  actions.append(read,edit,del);

  row.append(num,name,actions);

  list.append(row);

 });

}


/* CHAPTER EDITOR */

function openChapterEditor(){

 editingChapterIndex=null;

 document
  .getElementById("editorHeading")
  .textContent="Add Chapter";

 document
  .getElementById("chapterTitleInput")
  .value="";

 document
  .getElementById("chapterTextInput")
  .value="";

 hide();

 document
  .getElementById("editorSection")
  .classList
  .remove("hidden");

 document
  .getElementById("chapterTitleInput")
  .focus();

}


function editChapter(i){

 let c=current.chapters[i];

 editingChapterIndex=i;

 document
  .getElementById("editorHeading")
  .textContent="Edit Chapter";

 document
  .getElementById("chapterTitleInput")
  .value=c.title;

 document
  .getElementById("chapterTextInput")
  .value=c.text;

 hide();

 document
  .getElementById("editorSection")
  .classList
  .remove("hidden");

}


async function saveChapter(){

 let title=document
  .getElementById("chapterTitleInput")
  .value
  .trim();

 let text=document
  .getElementById("chapterTextInput")
  .value
  .trim();


 if(!title){

  toast("Please enter a chapter title.");

  return;

 }


 if(!text){

  toast("Please enter the chapter text.");

  return;

 }


 let chapter={

  title:title,

  text:text

 };


 if(editingChapterIndex===null){

  current.chapters.push(chapter);

  current.last=current.chapters.length-1;

  toast("Chapter saved.");

 }else{

  current.chapters[editingChapterIndex]=chapter;

  toast("Chapter updated.");

 }


 await save(current);

 openNovel(current);

}


async function deleteChapter(i){

 if(!confirm("Delete this chapter?"))return;

 current.chapters.splice(i,1);

 if(current.last>=current.chapters.length){

  current.last=
   Math.max(0,current.chapters.length-1);

 }

 await save(current);

 renderChapters();

 toast("Chapter deleted.");

}


/* READER */

function showChapters(){

 if(current)
  openNovel(current);
}


async function openReader(n,i){

 if(!n.chapters.length)return;

 current=n;

 chapterIndex=i;

 current.last=i;

 await save(current);

 hide();

 document
  .getElementById("readerSection")
  .classList
  .remove("hidden");


 let c=n.chapters[i];


 document
  .getElementById("chapterLabel")
  .textContent=
   "CHAPTER "+(i+1);


 document
  .getElementById("chapterTitle")
  .textContent=c.title;


 let content=document
  .getElementById("content");

 content.innerHTML="";


 let paragraphs=c.text
  .replace(/\r\n?/g,"\n")
  .split(/\n\s*\n/)
  .map(x=>x.trim())
  .filter(Boolean);


 paragraphs.forEach(p=>{

  let el=document.createElement("p");

  el.textContent=p;

  content.append(el);

 });


 document
  .getElementById("prev")
  .disabled=i<=0;


 document
  .getElementById("next")
  .disabled=
   i>=n.chapters.length-1;


 window.scrollTo(0,0);

}


function moveChapter(d){

 let x=chapterIndex+d;

 if(
  !current ||
  x<0 ||
  x>=current.chapters.length
 )return;

 openReader(current,x);

}


/* DELETE NOVEL */

async function deleteNovel(){

 if(!current)return;

 if(!confirm("Delete this novel and all its chapters?"))
  return;

 await remove(current.id);

 novels=novels.filter(
  x=>x.id!==current.id
 );

 current=null;

 library();

 toast("Novel deleted.");

}


/* SETTINGS */

function font(d){

 if(d===0)
  fontSize=20;
 else
  fontSize+=d;

 fontSize=
  Math.max(
   16,
   Math.min(28,fontSize)
  );

 document
  .documentElement
  .style
  .setProperty(
   "--size",
   fontSize+"px"
  );

 localStorage.setItem(
  "fontSize",
  fontSize
 );

}


function theme(){

 dark=!dark;

 document
  .body
  .classList
  .toggle("dark",dark);

 localStorage.setItem(
  "dark",
  dark?"1":"0"
 );

}


/* INITIALIZATION */

document
 .body
 .classList
 .toggle("dark",dark);

font(0);


(async()=>{

 try{

  novels=await all();

 }catch(e){

  console.error(e);

  novels=[];

 }

 library();

})();

</script>

</body>
</html>
